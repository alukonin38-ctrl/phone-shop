<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Магазин телефонов – регистрация и авторизация</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="main.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>📱 Магазин телефонов</h1>
        </header>

        <div class="auth-section" id="authSection">
            <div class="auth-tabs">
                <button class="tab-btn active" data-tab="loginTab"><i class="fas fa-sign-in-alt"></i> Вход</button>
                <button class="tab-btn" data-tab="registerTab"><i class="fas fa-user-plus"></i> Регистрация</button>
            </div>

            <div class="auth-card" id="loginTab">
                <h2><i class="fas fa-sign-in-alt"></i> Вход</h2>
                <div class="form-group">
                    <label>Логин</label>
                    <input type="text" id="loginInput" placeholder="Введите логин" autocomplete="username" />
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="passwordInput" placeholder="Введите пароль" autocomplete="current-password" />
                </div>
                <button id="loginBtn" class="auth-btn">Войти</button>
                <div id="loginMessage" class="message"></div>
            </div>

            <div class="auth-card hidden" id="registerTab">
                <h2><i class="fas fa-user-plus"></i> Регистрация</h2>
                <div class="form-group">
                    <label>Логин</label>
                    <input type="text" id="regLoginInput" placeholder="Придумайте логин" autocomplete="username" />
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="regPasswordInput" placeholder="Придумайте пароль" autocomplete="new-password" />
                </div>
                <div class="form-group">
                    <label>Подтверждение пароля</label>
                    <input type="password" id="regPasswordConfirmInput" placeholder="Повторите пароль" autocomplete="new-password" />
                </div>
                <button id="registerBtn" class="auth-btn">Зарегистрироваться</button>
                <div id="registerMessage" class="message"></div>
            </div>
        </div>

        <div id="catalogSection" class="hidden">
            <div class="user-greeting">
                <span>Добро пожаловать, <strong id="userNameDisplay"></strong>!</span>
                <button id="logoutBtn" class="small-btn"><i class="fas fa-sign-out-alt"></i> Выйти</button>
            </div>
            <div class="phones-grid" id="phonesGrid"></div>
        </div>

        <footer>
            <p>© 2025 Магазин телефонов | Хеширование паролей с солью</p>
        </footer>
    </div>
</body>
</html>
