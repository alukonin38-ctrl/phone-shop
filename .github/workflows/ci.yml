# CI: тесты (Happy/Negative path), покрытие и сценарий пользователя
#
# Запускается:
#   • при push в main и в ветки feature/** / fix/**
#   • при pull request в main
#   • вручную (Actions → CI → Run workflow)
#
# Ветки: работа идёт в feature/*, затем PR в main (см. CONTRIBUTING.md).

name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'tests/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Отменяем предыдущий запуск для этой же ветки, чтобы не гонять тесты дважды
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: server

jobs:
  # ---------------------------------------------------------------
  # Юнит-тесты + E2E-тесты API на двух версиях Node
  # ---------------------------------------------------------------
  tests:
    name: Тесты (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Установить зависимости
        run: npm ci

      - name: Тесты + покрытие (Node 22)
        if: matrix.node == '22'
        run: npm run test:coverage -- --ci

      - name: Тесты (Node 20)
        if: matrix.node == '20'
        run: npm test -- --ci

      - name: Сохранить отчёт о покрытии
        if: matrix.node == '22'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-node-${{ matrix.node }}
          path: server/coverage
          if-no-files-found: warn

      - name: Проверить зависимости на уязвимости (не блокирует сборку)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  # ---------------------------------------------------------------
  # Сценарий пользователя (интеграционная проверка «как в жизни»)
  # ---------------------------------------------------------------
  user-scenario:
    name: Сценарий пользователя
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Установить зависимости
        run: npm ci

      - name: Прогнать сценарий пользователя
        run: npm run scenario
